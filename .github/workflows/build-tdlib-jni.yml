name: Build TDLib JNI and Java Files for Android JNI Version (Release Mode)

on:
  workflow_dispatch:
    inputs:
      tdlib_version:
        description: 'TDLib Version / Tag / Commit SHA (e.g., v1.8.23)'
        required: true
        default: 'master'

jobs:
  build-android-jni-release:
    runs-on: ubuntu-latest

    steps:
      # 1. משיכת קוד המקור
      - name: Checkout TDLib Repository
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ github.event.inputs.tdlib_version }}
          fetch-depth: 1

      # 2. בניית ה-TDLib JNI באמצעות Docker BuildKit ויצוא ישיר למארח
      - name: Build Release TDLib Android JNI via Docker BuildKit
        run: |
          cd example/android
          mkdir -p ../../tdlib_raw_output
          
          DOCKER_BUILDKIT=1 docker build \
            --build-arg COMMIT_HASH=${{ github.event.inputs.tdlib_version }} \
            --build-arg BUILD_TYPE=Release \
            --output ../../tdlib_raw_output .

      # 3. חילוץ וארגון הקבצים לשימוש קל באנדרואיד סטודיו
      - name: Structure and Isolate JNI/Java Artifacts
        run: |
          set -e  # הגנה מפני קבצים חסרים - יכשיל את הריצה במקום לייצר ארטיפקט ריק
          mkdir -p output/jni_so_files output/java_source_files
          
          echo "=== שקוף: בדיקת תכולת התיקייה שנוצרה מתוך ה-Docker ==="
          ls -la tdlib_raw_output/
          
          # העתקת קובץ ה-ZIP של ה-libtdjni.so
          cp tdlib_raw_output/tdlib.zip output/jni_so_files/
          
          # העתקת קבצי ה-Java שנוצרו (TdApi.java ו-Client.java)
          if [ -d tdlib_raw_output/java/org ]; then
            cp -r tdlib_raw_output/java/org output/java_source_files/
          elif [ -d tdlib_raw_output/org ]; then
            cp -r tdlib_raw_output/org output/java_source_files/
          else
            echo "Java files missing in build output! Taking fallback from source repository."
            cp -r example/android/src/main/java/org output/java_source_files/
          fi

      # 4. שמירת הקבצים המוכנים כ-Artifact להורדה
      - name: Upload Release Android JNI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-jni-release-${{ github.event.inputs.tdlib_version }}
          path: output/
          if-no-files-found: error # יכשיל את ה-Action באופן רשמי אם התיקייה ריקה
