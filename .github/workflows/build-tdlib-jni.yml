name: Build TDLib JNI and Java Files for Android JNI Version (Release Mode)

on:
  workflow_dispatch:
    inputs:
      tdlib_version:
        description: 'TDLib Version / Tag / Commit SHA (e.g., v1.8.23)'
        required: true
        default: 'master'

jobs:
  build-android-jni-release:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone the specified TDLib version repository
      - name: Checkout TDLib Repository
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ github.event.inputs.tdlib_version }}
          fetch-depth: 1

      # 2. Safe virtual memory allocation to prevent compiler memory crashes without freezing on Ubuntu 26.04
      - name: Setup Compiler Swap Space
        run: |
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== Memory and Swap Status ==="
          free -m
          df -h

      # 3. Trigger Docker Build optimized for high-performance Release JNI binaries
      - name: Build Release TDLib Android JNI via Docker BuildKit
        run: |
          cd example/android
          mkdir -p ../../tdlib_raw_output
          # Invokes default native JNI compilation and optimizes binary sizes via Release mode
          DOCKER_BUILDKIT=1 docker build \
            --build-arg COMMIT_HASH=${{ github.event.inputs.tdlib_version }} \
            --build-arg BUILD_TYPE=Release \
            --output ../../tdlib_raw_output .

      # 4. Filter, restructure, and clean up the outputs specifically for Java application usage
      - name: Structure and Isolate JNI/Java Artifacts
        run: |
          mkdir -p output/jni_so_files output/java_source_files
          
          # Copy the unified zip archive containing the libtdjni.so compiled engines
          if [ -f tdlib_raw_output/tdlib.zip ]; then
            cp tdlib_raw_output/tdlib.zip output/jni_so_files/
          else
            echo "::error::Compiled release tdlib.zip binaries were not generated by Docker!"
            exit 1
          fi
          
          # Extract and isolate the newly generated TdApi.java and Client.java source packages
          if [ -d tdlib_raw_output/java/org ]; then
            cp -r tdlib_raw_output/java/org output/java_source_files/
          else
            echo "::error::Dynamically generated Java files (TdApi.java / Client.java) were missing in build output!"
            exit 1
          fi

      # 5. Export structured output to GitHub Action Artifacts
      - name: Upload Release Android JNI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-jni-release-${{ github.event.inputs.tdlib_version }}
          path: output/
