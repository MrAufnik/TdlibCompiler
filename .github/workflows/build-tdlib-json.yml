name: Build TDLib and Java Files for Android JSON Version (Release)

on:
  workflow_dispatch:
    inputs:
      tdlib_version:
        description: 'TDLib Version / Tag / Commit SHA (e.g., v1.8.23)'
        required: true
        default: 'master'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. משיכת קוד המקור של הגרסה הספציפית שנבחרה
      - name: Checkout TDLib Repository
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ github.event.inputs.tdlib_version }}
          fetch-depth: 1

      # 2. פינוי בטוח של שטח דיסק והגדרת Swap ללא נעילת מערכת ההפעלה באובונטו החדש
      - name: Safe Free Disk Space and Setup Swap
        run: |
          echo "=== Freeing up space safely ==="
          sudo apt-get clean
          # הסרת חבילות כבדות דרך מנהל החבילות במקום rm -rf אלים
          sudo apt-get remove --purge -y azure-cli google-cloud-sdk microsoft-edge-stable google-chrome-stable firefox monotone || true
          sudo apt-get autoremove -y
          
          echo "=== Allocating 8GB Swap File ==="
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          echo "=== Current Storage Layout ==="
          df -h
          free -m

      # 3. בניית ה-Docker Image עם הגדרת גרסת Release נקייה מסמלי Debug
      - name: Build TDLib Docker Image (Release Mode)
        run: |
          cd example/android
          docker build \
            --build-arg TDLIB_INTERFACE=JSON \
            --build-arg BUILD_TYPE=Release \
            -t tdlib-android-builder .

      # 4. יצירת קונטיינר זמני וחילוץ קבצי ה-Java וקבצי ה-.so מתוכו
      - name: Extract Compiled .so and Java Files
        run: |
          mkdir -p output/so_files output/java_files
          CONTAINER_ID=$(docker create tdlib-android-builder)
          
          # 1. העתקת קובץ ה-ZIP שמכיל את קבצי ה-.so של ה-Release
          docker cp $CONTAINER_ID:/root/tdlib.zip output/so_files/
          
          # 2. העתקת קבצי ה-Java מתוך קוד המקור של ה-Container
          docker cp $CONTAINER_ID:/td/example/android/src/main/java/org output/java_files/
          
          docker rm $CONTAINER_ID

      # 5. שמירת כל הקבצים כ-Artifact אחד מסודר
      - name: Upload All Artifacts (SO and Java)
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-json-release-${{ github.event.inputs.tdlib_version }}
          path: output/
