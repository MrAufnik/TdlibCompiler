name: Build TDLib JNI and Java Files for Android JNI Version (Release Mode)

on:
  workflow_dispatch:
    inputs:
      tdlib_version:
        description: 'TDLib Version / Tag / Commit SHA (e.g., v1.8.23)'
        required: true
        default: 'master'

jobs:
  build-android-jni-release:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone the specified TDLib version repository
      - name: Checkout TDLib Repository
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ github.event.inputs.tdlib_version }}
          fetch-depth: 1

      # 2. Trigger Docker Build optimized for high-performance Release JNI binaries
      - name: Build Release TDLib Android JNI via Docker BuildKit
        run: |
          cd example/android
          mkdir -p ../../tdlib_raw_output
          DOCKER_BUILDKIT=1 docker build \
            --build-arg COMMIT_HASH=${{ github.event.inputs.tdlib_version }} \
            --build-arg BUILD_TYPE=Release \
            --output ../../tdlib_raw_output .

      # 3. Unpack tdlib.zip (the Java API lives INSIDE it) and verify
      - name: Structure and Isolate JNI/Java Artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/jni_so_files output/java_source_files tdlib_extracted

          echo "=== Docker output ==="
          ls -lah tdlib_raw_output/
          [ -f tdlib_raw_output/tdlib.zip ] || { echo "::error::tdlib.zip not found"; exit 1; }

          cp tdlib_raw_output/tdlib.zip output/jni_so_files/
          unzip -q tdlib_raw_output/tdlib.zip -d tdlib_extracted
          find tdlib_extracted -maxdepth 4 | head -60

          JAVA_API=$(find tdlib_extracted -type f -path '*/org/drinkless/tdlib/TdApi.java' -print -quit)
          [ -n "$JAVA_API" ] || { echo "::error::TdApi.java not found inside tdlib.zip"; exit 1; }
          JAVA_ROOT="${JAVA_API%/org/drinkless/tdlib/TdApi.java}"

          # Client.java + TdApi.java are always generated (ClientManager.java is not)
          for F in Client.java TdApi.java; do
            [ -f "$JAVA_ROOT/org/drinkless/tdlib/$F" ] || { echo "::error::Missing $F"; exit 1; }
          done
          cp -r "$JAVA_ROOT/org" output/java_source_files/

          echo "=== Final output ==="
          ls -R output/ | head -60

      # 4. Export structured output to GitHub Action Artifacts
      - name: Upload Release Android JNI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-jni-release-${{ github.event.inputs.tdlib_version }}
          path: output/
          if-no-files-found: error
