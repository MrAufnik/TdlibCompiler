name: Build TDLib JNI and Java Files for Android JNI Version (Release Mode)

on:
  workflow_dispatch:
    inputs:
      tdlib_version:
        description: 'TDLib Version / Tag / Commit SHA (e.g., v1.8.23)'
        required: true
        default: 'master'

jobs:
  build-android-jni-release:
    runs-on: ubuntu-latest

    steps:
      # 1. משיכת קוד המקור של הגרסה הספציפית שנבחרה
      - name: Checkout TDLib Repository
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ github.event.inputs.tdlib_version }}
          fetch-depth: 1

      # 2. הגדרת זיכרון Swap בצורה בטוחה ומובנית למניעת קריסות ותקיעות באובונטו 26.04
      - name: Setup Compiler Swap Space Safely
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      # בדיקת מצב הזיכרון הנוכחי כדי לוודא שהכל תקין
      - name: Verify Memory Configuration
        run: |
          echo "=== Memory and Swap Status ==="
          free -m
          df -h

      # 3. בניית ה-TDLib באמצעות Docker BuildKit (גרסת JNI נייטיב ללא גרסת דיבאג)
      - name: Build Release TDLib Android JNI via Docker BuildKit
        run: |
          cd example/android
          mkdir -p ../../tdlib_raw_output
          DOCKER_BUILDKIT=1 docker build \
            --build-arg COMMIT_HASH=${{ github.event.inputs.tdlib_version }} \
            --build-arg BUILD_TYPE=Release \
            --output ../../tdlib_raw_output .

    
      # 4. Extract and structure Release JNI and Java sources
      - name: Structure and Isolate JNI/Java Artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output/jni_so_files
          mkdir -p output/java_source_files
          mkdir -p tdlib_extracted

          echo "=== Build Output ==="
          ls -lah tdlib_raw_output/

          # 1. Verify Release archive
          if [ ! -f tdlib_raw_output/tdlib.zip ]; then
            echo "::error::Release tdlib.zip not found!"
            exit 1
          fi

          # 2. Copy Release archive
          cp tdlib_raw_output/tdlib.zip output/jni_so_files/

          # 3. Extract archive to inspect its real structure
          unzip -q tdlib_raw_output/tdlib.zip -d tdlib_extracted

          echo "=== Archive Contents ==="
          find tdlib_extracted -maxdepth 5 -type f | head -100

          # 4. Locate generated TDLib Java API
          JAVA_API=$(find tdlib_extracted \
            -type f \
            -path '*/org/drinkless/tdlib/TdApi.java' \
            -print -quit)

          if [ -z "$JAVA_API" ]; then
            echo "::error::TdApi.java was not found inside tdlib.zip!"
            echo "Java interface may not have been included in the Docker build."
            exit 1
          fi

          # 5. Identify Java package root
          JAVA_ROOT="${JAVA_API%/org/drinkless/tdlib/TdApi.java}"

          echo "Java API found: $JAVA_API"
          echo "Java root: $JAVA_ROOT"

          # 6. Validate JNI Java wrapper files
          for FILE in Client.java ClientManager.java TdApi.java; do
            if [ ! -f "$JAVA_ROOT/org/drinkless/tdlib/$FILE" ]; then
              echo "::error::Missing Java source: $FILE"
              exit 1
            fi
          done

          # 7. Copy complete Java package
          cp -r "$JAVA_ROOT/org" output/java_source_files/

          # 8. Validate native Release binaries
          echo "=== JNI ZIP Verification ==="
          unzip -l output/jni_so_files/tdlib.zip | head -50

          echo "=== Java Sources Verification ==="
          find output/java_source_files -type f

          echo "=== Final Output Structure ==="
          ls -R output/

          echo "Release JNI and Java artifacts prepared successfully!"
