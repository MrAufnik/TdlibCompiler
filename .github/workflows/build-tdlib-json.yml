name: Build TDLib and Java Files for Android JSON Version (Release)

on:
  workflow_dispatch:
    inputs:
      tdlib_version:
        description: 'TDLib Version / Tag / Commit SHA (e.g., v1.8.23)'
        required: true
        default: 'master'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. משיכת קוד המקור
      - name: Checkout TDLib Repository
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ github.event.inputs.tdlib_version }}
          fetch-depth: 1

      # 2. בנייה ויצוא ישיר של קבצי ה-Release באמצעות BuildKit לתיקייה מקומית
      - name: Build TDLib JSON Release via Docker BuildKit
        run: |
          cd example/android
          mkdir -p ../../tdlib_raw_output
          
          # שימוש ב-BuildKit עם דגל --output מחלץ את הקבצים ישירות לשרת המארח
          DOCKER_BUILDKIT=1 docker build \
            --build-arg TDLIB_INTERFACE=JSON \
            --build-arg BUILD_TYPE=Release \
            --output ../../tdlib_raw_output .

      # 3. ארגון ובדיקת קיום הקבצים (הכשלת הצעד במקרה של קובץ חסר)
      - name: Structure and Verify Artifacts
        run: |
          set -e  # גורם לסקריפט להפסיק ולהיכשל מיד אם פקודה כלשהי נכשלת
          mkdir -p output/so_files output/java_files
          
          echo "=== שקוף: בדיקת תכולת התיקייה שנוצרה מתוך ה-Docker ==="
          ls -la tdlib_raw_output/
          
          # העתקת קובץ ה-ZIP של ה-.so
          cp tdlib_raw_output/tdlib.zip output/so_files/
          
          # העתקת קבצי ה-Java שג'ונרטו (הם נמצאים בתיקיית java/org בתוך תיקיית הפלט)
          if [ -d tdlib_raw_output/java/org ]; then
            cp -r tdlib_raw_output/java/org output/java_files/
          else
            echo "Java inside output not found, copying fallback from source repository"
            cp -r example/android/src/main/java/org output/java_files/
          fi

      # 4. שמירת כל הקבצים כ-Artifact אחד מסודר
      - name: Upload All Artifacts (SO and Java)
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-json-release-${{ github.event.inputs.tdlib_version }}
          path: output/
          if-no-files-found: error # יכשיל את ה-Action באופן רשמי אם אין קבצים בתיקייה
