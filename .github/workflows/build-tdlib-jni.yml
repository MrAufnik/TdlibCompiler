name: Build TDLib JNI and Java Files for Android JNI Version (Release Mode)

on:
  workflow_dispatch:
    inputs:
      tdlib_version:
        description: 'TDLib Version / Tag / Commit SHA (e.g., v1.8.23)'
        required: true
        default: 'master'

jobs:
  build-android-jni-release:
    runs-on: ubuntu-latest

    steps:
      # 1. משיכת קוד המקור של הגרסה הספציפית שנבחרה
      - name: Checkout TDLib Repository
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ github.event.inputs.tdlib_version }}
          fetch-depth: 1

      # 2. הגדרת זיכרון Swap בצורה בטוחה ומובנית למניעת קריסות ותקיעות באובונטו 26.04
      - name: Setup Compiler Swap Space Safely
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      # בדיקת מצב הזיכרון הנוכחי כדי לוודא שהכל תקין
      - name: Verify Memory Configuration
        run: |
          echo "=== Memory and Swap Status ==="
          free -m
          df -h

      # 3. בניית ה-TDLib באמצעות Docker BuildKit (גרסת JNI נייטיב ללא גרסת דיבאג)
      - name: Build Release TDLib Android JNI via Docker BuildKit
        run: |
          cd example/android
          mkdir -p ../../tdlib_raw_output
          DOCKER_BUILDKIT=1 docker build \
            --build-arg COMMIT_HASH=${{ github.event.inputs.tdlib_version }} \
            --build-arg BUILD_TYPE=Release \
            --output ../../tdlib_raw_output .

           # 4. Filter, restructure, and clean up the outputs specifically for Java application usage
      - name: Structure and Isolate JNI/Java Artifacts
        run: |
          mkdir -p output/jni_so_files output/java_source_files
          
          echo "=== Debugging Build Output Directory Structure ==="
          ls -R tdlib_raw_output || true
          
          # Copy the unified zip archive containing the libtdjni.so compiled engines
          if [ -f tdlib_raw_output/tdlib.zip ]; then
            cp tdlib_raw_output/tdlib.zip output/jni_so_files/
          elif [ -f tdlib_raw_output/root/tdlib.zip ]; then
            cp tdlib_raw_output/root/tdlib.zip output/jni_so_files/
          else
            echo "::error::Compiled release tdlib.zip binaries were not found!"
            exit 1
          fi
          
          # Route and capture the generated Java files dynamically
          if [ -d tdlib_raw_output/java/org ]; then
            cp -r tdlib_raw_output/java/org output/java_source_files/
          elif [ -d tdlib_raw_output/org ]; then
            cp -r tdlib_raw_output/org output/java_source_files/
          elif [ -d tdlib_raw_output/td/example/android/src/main/java/org ]; then
            cp -r tdlib_raw_output/td/example/android/src/main/java/org output/java_source_files/
          else
            echo "Warning: Dynamically generated Java files were not found in expected Docker outputs. Falling back to base repository sources."
            cp -r example/android/src/main/java/org output/java_source_files/
          fi
          
          echo "=== Structured Output Preview ==="
          ls -R output/

      # 5. שמירת הקבצים המוכנים כ-Artifact להורדה
      - name: Upload Release Android JNI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-jni-release-${{ github.event.inputs.tdlib_version }}
          path: output/
