name: Build TDLib JNI and Java Files for Android JNI Version (Release Mode)

on:
  workflow_dispatch:
    inputs:
      tdlib_version:
        description: 'TDLib Version / Tag / Commit SHA (e.g., v1.8.23)'
        required: true
        default: 'master'

jobs:
  build-android-jni-release:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone the specified TDLib version repository
      - name: Checkout TDLib Repository
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ github.event.inputs.tdlib_version }}
          fetch-depth: 1

      # 2. Trigger Docker Build optimized for high-performance Release JNI binaries
      - name: Build Release TDLib Android JNI via Docker BuildKit
        run: |
          cd example/android
          mkdir -p ../../tdlib_raw_output
          DOCKER_BUILDKIT=1 docker build \
            --build-arg COMMIT_HASH=${{ github.event.inputs.tdlib_version }} \
            --build-arg BUILD_TYPE=Release \
            --output ../../tdlib_raw_output .

      # 3. Restructure and cleanly isolate the Release artifacts
      - name: Structure and Isolate JNI/Java Artifacts
        run: |
          set -e
          mkdir -p output/jni_so_files output/java_source_files
          
          # Copy the release compiled .so engines (ignoring the heavy tdlib-debug.zip)
          cp tdlib_raw_output/tdlib.zip output/jni_so_files/
          
          # Dynamically look for TdApi/Client source paths inside the checked out tree
          if [ -d tdlib_raw_output/java/org ]; then
            cp -r tdlib_raw_output/java/org output/java_source_files/
          elif [ -d tdlib_raw_output/org ]; then
            cp -r tdlib_raw_output/org output/java_source_files/
          else
            echo "Java files missing in Docker flat output. Fetching from checked-out workspace root."
            cp -r src/main/java/org output/java_source_files/ || cp -r example/android/src/main/java/org output/java_source_files/
          fi

      # 4. Export structured output to GitHub Action Artifacts
      - name: Upload Release Android JNI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-jni-release-${{ github.event.inputs.tdlib_version }}
          path: output/
          if-no-files-found: error
