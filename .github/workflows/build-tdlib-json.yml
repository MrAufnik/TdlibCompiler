name: Build TDLib and Java Files for Android JSON Version (Release)

on:
  workflow_dispatch:
    inputs:
      tdlib_version:
        description: 'TDLib Version / Tag / Commit SHA (e.g., v1.8.23)'
        required: true
        default: 'master'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 0. Turn "1.8.64" / "v1.8.64" into a real commit (TDLib has no tags after v1.8.0)
      - name: Resolve TDLib Ref
        id: resolve
        shell: bash
        env:
          INPUT_REF: ${{ github.event.inputs.tdlib_version }}
        run: |
          set -euo pipefail
          REF="$INPUT_REF"
          VER="${REF#v}"
          if [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if git ls-remote --exit-code --tags https://github.com/tdlib/td "refs/tags/v$VER" >/dev/null 2>&1; then
              REF="v$VER"
              echo "Using real tag $REF"
            else
              git clone -q --filter=blob:none --no-checkout https://github.com/tdlib/td td_probe
              PATTERN="^Update version to ${VER//./\\.}\\.$"
              REF=$(git -C td_probe log origin/master --format=%H -E --grep="$PATTERN" | head -n 1)
              if [ -z "$REF" ]; then
                echo "::error::No 'Update version to $VER.' commit found in tdlib/td"
                exit 1
              fi
              echo "Resolved version $VER -> commit $REF"
              rm -rf td_probe
            fi
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      # 1. Clone the specified TDLib version repository
      - name: Checkout TDLib Repository
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ steps.resolve.outputs.ref }}
          fetch-depth: 1

      # 2. Build Release JSON libraries via Docker BuildKit
      - name: Build TDLib JSON Release via Docker BuildKit
        run: |
          cd example/android
          mkdir -p ../../tdlib_raw_output
          DOCKER_BUILDKIT=1 docker build \
            --build-arg TDLIB_INTERFACE=JSON \
            --build-arg COMMIT_HASH=${{ steps.resolve.outputs.ref }} \
            --build-arg BUILD_TYPE=Release \
            --output ../../tdlib_raw_output .

      # 3. Unpack tdlib.zip and collect libs (+ Java sources if the zip has them)
      - name: Structure and Verify Artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/so_files output/java_files tdlib_extracted

          echo "=== Docker output ==="
          ls -lah tdlib_raw_output/
          [ -f tdlib_raw_output/tdlib.zip ] || { echo "::error::tdlib.zip not found"; exit 1; }

          cp tdlib_raw_output/tdlib.zip output/so_files/
          unzip -q tdlib_raw_output/tdlib.zip -d tdlib_extracted
          find tdlib_extracted -maxdepth 4 | head -60

          # JSON build must ship libtdjson.so; Java sources are optional here
          find tdlib_extracted -name 'libtdjson.so' | grep -q . || { echo "::error::libtdjson.so missing"; exit 1; }

          JAVA_API=$(find tdlib_extracted -type f -path '*/org/drinkless/tdlib/TdApi.java' -print -quit)
          if [ -n "$JAVA_API" ]; then
            cp -r "${JAVA_API%/org/drinkless/tdlib/TdApi.java}/org" output/java_files/
          else
            echo "No Java sources in JSON build (expected)."
            rmdir output/java_files
          fi

          ls -R output/ | head -60

      # 4. Save and generate clean downloadeable ZIP bundles
      - name: Upload All Artifacts (SO and Java)
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-json-release-${{ github.event.inputs.tdlib_version }}
          path: output/
          if-no-files-found: error
