name: Build TDLib and Java Files for Android JSON Version (Release)

on:
  workflow_dispatch:
    inputs:
      tdlib_version:
        description: 'TDLib Version / Tag / Commit SHA (e.g., v1.8.23)'
        required: true
        default: 'master'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone the specified TDLib version repository
      - name: Checkout TDLib Repository
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ github.event.inputs.tdlib_version }}
          fetch-depth: 1

      # 2. Build Release JSON libraries via Docker BuildKit
      - name: Build TDLib JSON Release via Docker BuildKit
        run: |
          cd example/android
          mkdir -p ../../tdlib_raw_output
          DOCKER_BUILDKIT=1 docker build \
            --build-arg TDLIB_INTERFACE=JSON \
            --build-arg BUILD_TYPE=Release \
            --output ../../tdlib_raw_output .

      # 3. Structure, sort, and isolate the outputs safely
      - name: Structure and Verify Artifacts
        run: |
          set -e
          mkdir -p output/so_files output/java_files
          
          # Safely copy the optimized production release binary
          cp tdlib_raw_output/tdlib.zip output/so_files/
          
          # Match and extract Java sources safely across execution fallback directories
          if [ -d tdlib_raw_output/java/org ]; then
            cp -r tdlib_raw_output/java/org output/java_files/
          elif [ -d tdlib_raw_output/org ]; then
            cp -r tdlib_raw_output/org output/java_files/
          else
            echo "Using base checkout directory matching trees."
            cp -r src/main/java/org output/java_files/ || cp -r example/android/src/main/java/org output/java_files/
          fi

      # 4. Save and generate clean downloadeable ZIP bundles
      - name: Upload All Artifacts (SO and Java)
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-json-release-${{ github.event.inputs.tdlib_version }}
          path: output/
          if-no-files-found: error
